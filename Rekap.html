<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rekap Owner</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#0b2a6f; --blue2:#1d4ed8; --gold:#d4af37; --gold2:#f5d26a;
    --ice:#f6f8ff; --ink:#0b2a6f; --shadow:rgba(11,42,111,.16);
    --green:#0d9488; --red:#e0473f; --gray:rgba(11,42,111,.62);
    --purple:#7c5cbf; --coral:#e2793d;
    --radius:18px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ font-size:15px; }
  body{
    margin:0; padding:20px 14px 90px; font-family:'Poppins',sans-serif; color:var(--blue);
    background:
      radial-gradient(circle at 12% 15%, rgba(212,175,55,.16), transparent 45%),
      radial-gradient(circle at 88% 20%, rgba(29,78,216,.12), transparent 44%),
      radial-gradient(circle at 50% 110%, rgba(212,175,55,.10), transparent 48%),
      linear-gradient(135deg,#ffffff 0%, #f0f4ff 55%, #ffffff 100%);
    background-attachment:fixed; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:560px; margin:0 auto; }
  svg.ic{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; vertical-align:-3px; }

  header{
    text-align:center; margin-bottom:16px; background:linear-gradient(180deg,#fff,var(--ice));
    border-radius:20px; border:2.5px solid var(--ink); box-shadow:6px 6px 0px var(--shadow);
    padding:20px 14px; position:relative; overflow:hidden;
  }
  header::before{
    content:""; position:absolute; top:0; left:0; right:0; height:7px;
    background:linear-gradient(90deg, var(--gold) 0 22%, transparent 22% 78%, var(--gold) 78% 100%), linear-gradient(90deg,var(--blue) 0 100%);
    opacity:.95;
  }
  header .hicon{ width:34px; height:34px; margin:0 auto 8px; background:linear-gradient(135deg,var(--gold),var(--gold2)); border:2px solid var(--ink); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.2s; }
  header .hicon:active{ transform:scale(0.9); }
  header .hicon svg{ width:18px; height:18px; }
  header h1{
    font-family:'Outfit',sans-serif; font-weight:900; font-size:1.4rem; margin:0 0 6px;
    text-shadow:0 2px 0 rgba(255,255,255,.9); letter-spacing:.2px;
  }
  header .badge{
    display:inline-block; font-weight:800; font-size:.7rem; color:var(--blue); letter-spacing:.3px;
    background:rgba(212,175,55,.18); border:1.5px solid var(--ink); border-radius:999px;
    padding:5px 14px;
  }

  .date-bar{
    display:flex; align-items:center; gap:10px; background:linear-gradient(180deg,#fff,var(--ice));
    border-radius:16px; padding:10px 14px; box-shadow:5px 5px 0px var(--shadow); margin-bottom:14px;
    border:2.5px solid var(--ink);
  }
  .date-bar label{ font-size:.72rem; font-weight:800; color:var(--gray); display:flex; align-items:center; gap:4px; }
  .date-bar input[type=date]{
    flex:1; border:none; font-family:'Outfit',sans-serif; font-weight:700; font-size:.9rem;
    color:var(--blue); background:transparent; outline:none;
  }
  .date-bar button{
    border:1.5px solid var(--ink); background:var(--gold2); color:var(--blue); font-weight:800;
    font-size:.7rem; padding:7px 10px; border-radius:10px; cursor:pointer; white-space:nowrap;
    font-family:'Outfit',sans-serif; box-shadow:2px 2px 0px var(--shadow);
  }
  .date-bar button:active{ transform:translateY(2px); box-shadow:none; }

  .tabs{ display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; padding:2px; }
  .tab-btn{
    flex:0 0 auto; border:2px solid var(--ink); background:rgba(255,255,255,.85); padding:9px 13px;
    font-weight:800; font-family:'Outfit',sans-serif; font-size:.72rem; color:var(--blue);
    border-radius:12px; cursor:pointer; transition:.2s ease; white-space:nowrap;
    box-shadow:3px 3px 0px var(--shadow); display:flex; align-items:center; gap:5px;
  }
  .tab-btn:active{ transform:translateY(2px); box-shadow:none; }
  .tab-btn.active{ background:var(--blue); color:#fff; border-color:var(--blue); }

  .card{
    background:linear-gradient(180deg,#fff,var(--ice)); border-radius:var(--radius); padding:20px;
    box-shadow:6px 6px 0px var(--shadow); border:2.5px solid var(--ink); margin-bottom:16px;
    position:relative; overflow:hidden;
  }
  .card h2{ font-family:'Outfit',sans-serif; font-weight:800; font-size:1.02rem; margin:0 0 14px; display:flex; align-items:center; gap:7px; }
  .card h2 small{ display:block; color:var(--gray); font-weight:500; font-size:.72rem; margin-top:3px; }

  .field{ margin-bottom:10px; }
  .field label{ display:block; font-size:.75rem; font-weight:800; margin-bottom:5px; color:var(--blue); }
  .field input, .field select{
    width:100%; border:2px solid rgba(11,42,111,.2); background:#fff; border-radius:12px; padding:10px 12px;
    font-family:'Poppins',sans-serif; font-size:.9rem; color:var(--blue); outline:none; transition:.2s;
  }
  .field input:focus, .field select:focus{ border-color:var(--blue2); box-shadow:0 0 0 3px rgba(29,78,216,.12); }
  .row2{ display:flex; gap:10px; }
  .row2 > .field{ flex:1; }

  .btn{
    border:2.5px solid var(--gold); border-radius:13px; padding:12px; font-weight:900;
    font-family:'Outfit',sans-serif; cursor:pointer; transition:.2s cubic-bezier(.175,.885,.32,1.275);
    width:100%; font-size:.86rem; text-transform:uppercase; letter-spacing:.3px;
    box-shadow:4px 4px 0px rgba(11,42,111,.18); position:relative; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn:hover{ transform:translateY(-2px); box-shadow:6px 6px 0px rgba(11,42,111,.22); }
  .btn:active{ transform:translateY(2px); box-shadow:0 2px 0 var(--gold); }
  .btn-primary{ background:var(--blue); color:#fff; }
  .btn-gold{ background:linear-gradient(135deg,var(--gold),var(--gold2)); color:var(--blue); border-color:var(--blue); }
  .btn-gold:active{ box-shadow:0 2px 0 var(--blue); }
  .btn-ghost{ background:#fff; color:var(--blue); border:2px dashed rgba(11,42,111,.3); box-shadow:none; }
  .btn-ghost:hover{ transform:none; box-shadow:none; background:rgba(212,175,55,.08); }
  .btn-sm{ width:auto; padding:8px 12px; font-size:.7rem; border-radius:10px; box-shadow:3px 3px 0px rgba(11,42,111,.16); }
  .btn-danger{ background:#fff; color:var(--red); border-color:var(--red); }
  .btn-row{ display:flex; gap:8px; }
  .btn-row .btn{ flex:1; }

  .list-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:11px 0; border-bottom:1.5px dashed rgba(11,42,111,.15);
  }
  .list-item:last-child{ border-bottom:none; }
  .li-main{ flex:1; min-width:0; }
  .li-title{ font-weight:700; font-size:.87rem; }
  .li-date{ font-size:.68rem; color:var(--gray); font-weight:600; margin-top:1px; }
  .li-amt{ font-family:'Outfit',sans-serif; font-weight:800; font-size:.9rem; white-space:nowrap; }
  .li-del{
    border:1.5px solid var(--red); background:#ffe3e1; color:var(--red); width:28px; height:28px;
    border-radius:8px; font-weight:900; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .empty{ text-align:center; color:var(--gray); font-size:.85rem; padding:26px 10px; font-weight:600; }
  .empty svg{ width:26px; height:26px; display:block; margin:0 auto 8px; opacity:.5; }

  .total-box{
    background:linear-gradient(135deg,var(--blue),#153c98); border-radius:16px; padding:18px;
    color:#fff; border:2.5px solid var(--gold); margin-top:8px; position:relative; overflow:hidden;
  }
  .result-row{ display:flex; justify-content:space-between; font-size:.85rem; opacity:.92; margin-bottom:6px; }
  .grand-total{
    font-size:1.3rem; font-weight:900; margin-top:8px; padding-top:8px;
    border-top:1.5px dashed rgba(255,255,255,.3); color:var(--gold2); font-family:'Outfit',sans-serif; opacity:1;
    display:flex; justify-content:space-between; align-items:center;
  }

  .summary-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .stat{ background:linear-gradient(180deg,#fff,var(--ice)); border-radius:14px; padding:14px; box-shadow:4px 4px 0px var(--shadow); border:2px solid var(--ink); }
  .stat .lbl{ font-size:.64rem; font-weight:800; color:var(--gray); text-transform:uppercase; letter-spacing:.3px; }
  .stat .val{ font-family:'Outfit',sans-serif; font-weight:900; font-size:1.02rem; margin-top:4px; }
  .stat.income .val{ color:var(--green); }
  .stat.expense .val{ color:var(--red); }
  .stat.salary .val{ color:var(--blue2); }
  .stat.net .val{ color:#b8860b; }

  .seg{ display:flex; background:#fff; border:2px solid var(--ink); border-radius:13px; padding:4px; margin-bottom:14px; box-shadow:3px 3px 0px var(--shadow); }
  .seg button{ flex:1; border:none; background:transparent; padding:8px; border-radius:9px; font-weight:800; font-family:'Outfit',sans-serif; font-size:.74rem; color:var(--gray); cursor:pointer; text-transform:uppercase; }
  .seg button.active{ background:var(--blue); color:#fff; }

  .member-row{ border:2px solid rgba(11,42,111,.18); border-radius:14px; padding:12px; margin-bottom:10px; transition:.2s; background:#fff; }
  .member-row.paid{ border-color:var(--green); background:#effcf8; }
  .member-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; gap:8px; }
  .member-name{ font-weight:800; font-size:.9rem; }
  .member-wallet{ font-size:.68rem; color:var(--gray); font-weight:600; display:flex; align-items:center; gap:4px; margin-top:2px; }
  .member-wallet a{ color:var(--blue2); font-weight:800; text-decoration:none; }
  .member-bottom{ display:flex; gap:8px; align-items:center; }
  .member-bottom input[type=number]{ flex:1; border:2px solid rgba(11,42,111,.2); background:#f8fafc; border-radius:10px; padding:8px 10px; font-family:'Outfit',sans-serif; font-weight:800; font-size:.9rem; color:var(--blue2); outline:none; }
  .paid-toggle{ display:flex; align-items:center; gap:5px; font-size:.7rem; font-weight:800; color:var(--gray); cursor:pointer; user-select:none; white-space:nowrap; }
  .paid-toggle input{ width:17px; height:17px; accent-color:var(--green); cursor:pointer; }

  .divisi-chip{ display:inline-block; font-size:.62rem; font-weight:800; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.3px; border:1.5px solid; white-space:nowrap; }
  .div-admin{ color:var(--blue2); background:rgba(29,78,216,.1); border-color:var(--blue2); }
  .div-jaseb{ color:var(--green); background:rgba(13,148,136,.1); border-color:var(--green); }
  .div-editing{ color:#a3821b; background:rgba(212,175,55,.16); border-color:var(--gold); }
  .div-wording{ color:var(--purple); background:rgba(124,92,191,.1); border-color:var(--purple); }
  .div-manips{ color:var(--coral); background:rgba(226,121,61,.12); border-color:var(--coral); }
  .div-custom{ color:var(--gray); background:rgba(11,42,111,.06); border-color:rgba(11,42,111,.35); }

  .roster-card{ border:2px solid rgba(11,42,111,.18); border-radius:14px; padding:13px; margin-bottom:10px; background:#fff; }
  .roster-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px; }
  .roster-id{ display:flex; align-items:center; gap:10px; min-width:0; }
  .roster-avatar{ width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--gold),var(--gold2)); border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center; font-family:'Outfit',sans-serif; font-weight:900; color:var(--blue); font-size:.85rem; flex-shrink:0; }
  .roster-name{ font-weight:800; font-size:.92rem; }
  .roster-sub{ font-size:.72rem; color:var(--gray); font-weight:600; margin-top:1px; display:flex; align-items:center; gap:4px; }
  .roster-actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{ width:28px; height:28px; border-radius:8px; border:1.5px solid rgba(11,42,111,.25); background:#fff; color:var(--blue); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .icon-btn.danger{ border-color:var(--red); color:var(--red); background:#ffe3e1; }
  .roster-wallet-line{ font-size:.76rem; font-weight:700; color:var(--blue); background:var(--ice); border:1.5px dashed rgba(11,42,111,.25); border-radius:10px; padding:8px 10px; display:flex; align-items:center; gap:8px; margin-top:6px; }
  .qris-thumb{ width:34px; height:34px; border-radius:8px; object-fit:cover; border:1.5px solid var(--ink); flex-shrink:0; }

  .wallet-seg{ display:flex; gap:6px; margin-bottom:10px; }
  .wallet-seg button{ flex:1; border:2px solid rgba(11,42,111,.25); background:#fff; padding:9px 6px; border-radius:11px; font-weight:800; font-family:'Outfit',sans-serif; font-size:.74rem; color:var(--gray); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px; }
  .wallet-seg button.active{ background:var(--blue); border-color:var(--blue); color:#fff; }

  .upload-box{ border:2px dashed rgba(11,42,111,.3); border-radius:13px; padding:14px; text-align:center; cursor:pointer; background:var(--ice); position:relative; }
  .upload-box:hover{ background:rgba(212,175,55,.08); }
  .upload-box input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .upload-box .u-label{ font-size:.78rem; font-weight:800; color:var(--blue); }
  .upload-box .u-sub{ font-size:.68rem; color:var(--gray); margin-top:3px; font-weight:600; }
  .qris-preview{ display:flex; align-items:center; gap:10px; background:var(--ice); border:2px solid rgba(11,42,111,.2); border-radius:13px; padding:10px; }
  .qris-preview img{ width:52px; height:52px; object-fit:cover; border-radius:9px; border:1.5px solid var(--ink); }
  .qris-preview .qp-name{ font-size:.78rem; font-weight:700; flex:1; }
  .qris-preview button{ border:1.5px solid var(--red); background:#ffe3e1; color:var(--red); border-radius:8px; padding:6px 9px; font-weight:800; font-size:.68rem; cursor:pointer; }

  table{ width:100%; border-collapse:separate; border-spacing:0; border-radius:14px; overflow:hidden; border:2.5px solid var(--blue); background:#fff; font-size:.76rem; }
  thead th{ background:linear-gradient(90deg,var(--blue),#153c98); color:#fff; padding:10px 5px; text-align:center; font-family:'Outfit',sans-serif; font-weight:700; text-transform:uppercase; font-size:.64rem; }
  td{ padding:9px 5px; border-bottom:1.5px solid rgba(11,42,111,.1); border-right:1.5px solid rgba(11,42,111,.08); text-align:center; font-weight:600; }
  td:last-child, th:last-child{ border-right:none; }
  tr:last-child td{ border-bottom:none; }
  tbody tr:nth-child(even){ background:rgba(212,175,55,.05); }

  #toast{
    position:fixed; top:-100px; left:50%; transform:translateX(-50%); background:var(--blue); color:#fff;
    padding:13px 22px; border-radius:14px; display:flex; align-items:center; gap:10px; font-weight:700;
    font-size:.85rem; box-shadow:0 10px 30px rgba(0,0,0,.25); z-index:9999; transition:.5s cubic-bezier(.175,.885,.32,1.275);
    border:2px solid var(--gold); min-width:220px; justify-content:center; text-align:center;
  }
  #toast.show{ top:16px; }
  .toast-icon{ background:var(--gold); color:var(--blue); width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .toast-icon svg{ width:12px; height:12px; }

  .grandtotal-card{ background:linear-gradient(135deg,var(--gold),var(--gold2)); border-radius:20px; padding:20px; border:2.5px solid var(--blue); box-shadow:6px 6px 0px var(--shadow); margin-bottom:16px; position:relative; overflow:hidden; }
  .grandtotal-card .gt-label{ font-family:'Outfit',sans-serif; font-weight:900; font-size:.76rem; text-transform:uppercase; letter-spacing:.4px; color:var(--blue); opacity:.8; margin-bottom:6px; }
  .grandtotal-card .gt-value{ font-family:'Outfit',sans-serif; font-weight:900; font-size:1.85rem; color:var(--blue); text-shadow:0 2px 0 rgba(255,255,255,.5); }
  .gt-sub{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .gt-chip{ flex:1; min-width:100px; background:rgba(255,255,255,.55); border:1.5px solid var(--blue); border-radius:12px; padding:9px 10px; }
  .gt-chip .c-lbl{ font-size:.6rem; font-weight:800; color:var(--blue); opacity:.75; text-transform:uppercase; }
  .gt-chip .c-val{ font-family:'Outfit',sans-serif; font-weight:800; font-size:.86rem; color:var(--blue); margin-top:2px; }

  .loading{ text-align:center; padding:60px 10px; color:var(--gray); font-weight:700; }
  .hidden{ display:none !important; }
  .section-gap{ height:6px; }

  @keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }
  .tab-content:not(.hidden) .card{ animation:fadeIn .35s ease; }
</style>
</head>
<body>
<div id="toast"><div class="toast-icon"><svg viewBox="0 0 24 24" class="ic"><polyline points="20 6 9 17 4 12"></polyline></svg></div><span id="toastMsg">Tersimpan</span></div>

<div class="wrap">
  <header>
    <div class="hicon" id="resetDataBtn" title="Reset Semua Data"><svg viewBox="0 0 24 24" class="ic" style="width:18px;height:18px;stroke:var(--blue)"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></div>
    <h1>Rekap Gaji Crew</h1>
    <span class="badge">DiptARM &middot; Kas &amp; Gaji Team</span>
  </header>

  <div id="loadingScreen" class="loading">Memuat data...</div>

  <div id="app" class="hidden">
    <div class="date-bar">
      <label><svg viewBox="0 0 24 24" class="ic"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> Tanggal</label>
      <input type="date" id="dateInput">
      <button id="todayBtn">Hari Ini</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="ringkasan"><svg viewBox="0 0 24 24" class="ic"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>Ringkasan</button>
      <button class="tab-btn" data-tab="penghasilan"><svg viewBox="0 0 24 24" class="ic"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>Penghasilan</button>
      <button class="tab-btn" data-tab="pengeluaran"><svg viewBox="0 0 24 24" class="ic"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.3 2.3c-.6.6-.2 1.7.7 1.7H17M17 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM9 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path></svg>Pengeluaran</button>
      <button class="tab-btn" data-tab="gajiteam"><svg viewBox="0 0 24 24" class="ic"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Gaji Team</button>
      <button class="tab-btn" data-tab="roster"><svg viewBox="0 0 24 24" class="ic"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M15 8h3M15 12h3M6 17c.5-1.5 1.8-2.4 3-2.4s2.5.9 3 2.4"></path></svg>Roster</button>
      <button class="tab-btn" data-tab="riwayat"><svg viewBox="0 0 24 24" class="ic"><path d="M3 3v5h5"></path><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"></path><path d="M12 7v5l4 2"></path></svg>Riwayat</button>
    </div>

    <div id="tab-ringkasan" class="tab-content"></div>
    <div id="tab-penghasilan" class="tab-content hidden"></div>
    <div id="tab-pengeluaran" class="tab-content hidden"></div>
    <div id="tab-gajiteam" class="tab-content hidden"></div>
    <div id="tab-roster" class="tab-content hidden"></div>
    <div id="tab-riwayat" class="tab-content hidden"></div>
  </div>
</div>

<script>
/* ---------------- ICONS ---------------- */
const ICO = {
  plus:'<svg viewBox="0 0 24 24" class="ic"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
  trash:'<svg viewBox="0 0 24 24" class="ic"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>',
  edit:'<svg viewBox="0 0 24 24" class="ic"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path></svg>',

  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
function fmtTanggal(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('id-ID',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
}
function bulanKey(iso){ return iso.slice(0,7); }
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

/* ---------------- STORAGE ---------------- */
async function loadAll(){
  roster = await safeGet('roster', seedRoster());
  income = await safeGet('income', []);
  expense = await safeGet('expense', []);
  salary = await safeGet('salary', []);
}
async function safeGet(key, fallback){
  try{
    const r = localStorage.getItem(key);
    return r ? JSON.parse(r) : fallback;
  }catch(e){ return fallback; }
}
async function save(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ console.error('Gagal menyimpan', key, e); toast('Gagal menyimpan data'); }
}

/* ---------------- CALC HELPERS ---------------- */
function totalsForDate(iso){
  const inc = income.filter(x=>x.date===iso).reduce((s,x)=>s+Number(x.amount),0);
  const exp = expense.filter(x=>x.date===iso).reduce((s,x)=>s+Number(x.amount),0);
  const sal = salary.filter(x=>x.date===iso).reduce((s,x)=>s+Number(x.amount),0);
  return {inc, exp, sal, totalOut: exp+sal, net: inc-exp-sal};
}
function totalsForMonth(iso){
  const bk = bulanKey(iso);
  const inc = income.filter(x=>bulanKey(x.date)===bk).reduce((s,x)=>s+Number(x.amount),0);
  const exp = expense.filter(x=>bulanKey(x.date)===bk).reduce((s,x)=>s+Number(x.amount),0);
  const sal = salary.filter(x=>bulanKey(x.date)===bk).reduce((s,x)=>s+Number(x.amount),0);
  return {inc, exp, sal, totalOut: exp+sal, net: inc-exp-sal};
}
function totalsAllTime(){
  const inc = income.reduce((s,x)=>s+Number(x.amount),0);
  const exp = expense.reduce((s,x)=>s+Number(x.amount),0);
  const sal = salary.reduce((s,x)=>s+Number(x.amount),0);
  return {inc, exp, sal, totalOut: exp+sal, net: inc-exp-sal};
}

function renderGajiTeam(){
  const iso = selDate();
  const el = document.getElementById('tab-gajiteam');
  if(!roster.length){
    el.innerHTML = `<div class="card"><div class="empty">${ICO.empty}Roster masih kosong.<br>Tambahkan anggota di tab Roster terlebih dahulu.</div></div>`;
    return;
  }
  const entries = roster.map(m=>{
    const existing = salary.find(s=>s.date===iso && s.memberId===m.id);
    return {member:m, entry:existing};
  });
  const totalHariIni = entries.reduce((s,e)=>s + (e.entry ? Number(e.entry.amount) : 0), 0);

  el.innerHTML = `
    <div class="card">
      <h2>Gaji Team <small>${fmtTanggal(iso)}</small></h2>
      ${entries.map(({member,entry})=>`
        <div class="member-row ${entry && entry.paid ? 'paid':''}" data-id="${member.id}">
          <div class="member-top">
            <div>
              <div class="member-name">${escapeHtml(member.nickname)} <span class="divisi-chip ${divisiClass(member.divisi)}">${escapeHtml(member.divisi||'Custom')}</span></div>
              <div class="member-wallet">${walletLine(member)}</div>
            </div>
          </div>
          <div class="member-bottom">
            <input type="number" min="0" placeholder="Jumlah gaji" class="gaji-input" value="${entry ? entry.amount : ''}">
            <label class="paid-toggle"><input type="checkbox" class="gaji-paid" ${entry && entry.paid ? 'checked':''}> Dibayar</label>
          </div>
        </div>
      `).join('')}
    </div>
    <div class="total-box">
      <div class="grand-total"><span>Total Gaji Hari Ini</span><span>${rupiah(totalHariIni)}</span></div>
    </div>
  `;

  el.querySelectorAll('.member-row').forEach(row=>{
    const memberId = row.dataset.id;
    const member = roster.find(m=>m.id===memberId);
    const inputEl = row.querySelector('.gaji-input');
    const paidEl = row.querySelector('.gaji-paid');
    const commit = async ()=>{
      const amt = Number(inputEl.value)||0;
      let entry = salary.find(s=>s.date===iso && s.memberId===memberId);
      if(amt<=0 && !paidEl.checked){
        if(entry) salary = salary.filter(s=>s!==entry);
      } else {
        if(!entry){
          entry = {id:uid(), date:iso, memberId};
          salary.push(entry);
        }
        entry.nickname = member.nickname;
        entry.divisi = member.divisi;
        entry.walletType = member.walletType;
        entry.walletNumber = member.walletNumber;
        entry.amount = amt;
        entry.paid = paidEl.checked;
      }
      await save('salary', salary);
      row.classList.toggle('paid', paidEl.checked);
    };
    inputEl.addEventListener('change', commit);
    paidEl.addEventListener('change', commit);
  });
}

function resetRosterDraft(){

function compressImage(file, maxW=480, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

              <button class="icon-btn" data-edit="${m.id}">${ICO.edit}</button>
              <button class="icon-btn danger" data-del="${m.id}">${isArmed ? 'Yakin?' : ICO.trash}</button>
            </div>
          </div>
          <div class="roster-wallet-line">${walletDetail}</div>
        </div>`;
    });
  }
  html += `</div>`;
  el.innerHTML = html;

  if(rosterFormOpen){
    renderWalletField(existing ? existing.walletNumber : '');
    document.querySelectorAll('#rWalletSeg button').forEach(b=>{
      b.onclick = ()=>{ rosterDraftWalletType = b.dataset.w; document.querySelectorAll('#rWalletSeg button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderWalletField(existing ? existing.walletNumber : ''); };
    });
    document.getElementById('rCancel').onclick = ()=>{ rosterFormOpen=false; resetRosterDraft(); renderRoster(); };
    document.getElementById('rSave').onclick = async ()=>{
      const nickname = document.getElementById('rNick').value.trim();
      const phone = document.getElementById('rPhone').value.trim();
      const divisi = document.getElementById('rDivisi').value;
      if(!nickname){ toast('Isi nickname dulu'); return; }
      let walletNumber = '', walletQris = null;
      if(rosterDraftWalletType==='qris'){
        walletQris = rosterDraftQris;
        if(!walletQris){ toast('Unggah foto QRIS dulu'); return; }
      } else {
        walletNumber = document.getElementById('rWalletNumber').value.trim();
        if(!walletNumber){ toast('Isi nomor e-wallet dulu'); return; }
      }
      if(rosterEditingId){
        const idx = roster.findIndex(m=>m.id===rosterEditingId);
        roster[idx] = {...roster[idx], nickname, phone, divisi, walletType:rosterDraftWalletType, walletNumber, walletQris};
      } else {
        roster.push({id:uid(), nickname, phone, divisi, walletType:rosterDraftWalletType, walletNumber, walletQris});
      }
      await save('roster', roster);
      toast('Roster tersimpan');
      rosterFormOpen = false; resetRosterDraft();
      renderRoster();
    };
  } else {
    document.getElementById('rAddBtn').onclick = ()=>openRosterForm(null);
  }

  el.querySelectorAll('[data-edit]').forEach(b=>b.onclick = ()=>openRosterForm(roster.find(m=>m.id===b.dataset.edit)));
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick = async ()=>{
    const id = b.dataset.del;
    if(!deleteArm[id]){
      deleteArm[id] = true;
      renderRoster();
      setTimeout(()=>{ if(deleteArm[id]){ deleteArm[id]=false; renderRoster(); } }, 2500);
      return;
    }
    deleteArm[id] = false;
    roster = roster.filter(m=>m.id!==id);
    await save('roster', roster);
    toast('Anggota dihapus');
    renderRoster();
  });
}

/* ---------------- RIWAYAT ---------------- */
function renderRiwayat(){
  const el = document.getElementById('tab-riwayat');
  const all = [
    ...income.map(x=>({...x, tipe:'Penghasilan', sign:1})),
    ...expense.map(x=>({...x, tipe:'Pengeluaran', sign:-1})),
    ...salary.map(x=>({...x, desc:(x.nickname||'Gaji')+' ('+(x.divisi||'-')+')', tipe:'Gaji Team', sign:-1})),
  ].sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

  el.innerHTML = `
    <div class="card">
      <h2>Riwayat Transaksi <small>${all.length} total transaksi</small></h2>
      ${all.length ? `
      <table>
        <thead><tr><th>Tanggal</th><th>Tipe</th><th>Keterangan</th><th>Jumlah</th></tr></thead>
        <tbody>
          ${all.map(x=>`
            <tr>
              <td>${new Date(x.date+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'2-digit'})}</td>
              <td>${x.tipe}</td>
              <td style="text-align:left;">${escapeHtml(x.desc||'-')}</td>
              <td style="color:${x.sign>0?'var(--green)':'var(--red)'};font-weight:800;">${x.sign>0?'+':'-'}${rupiah(x.amount)}</td>
            </tr>`).join('')}
        </tbody>
      </table>` : `<div class="empty">${ICO.empty}Belum ada riwayat transaksi</div>`}
    </div>
  `;
}

/* ---------------- UTIL ---------------- */
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- RESET DATA ---------------- */
document.getElementById('resetDataBtn').addEventListener('click', async () => {
  if(confirm('⚠️ PERINGATAN:\nApakah Anda yakin ingin mereset/menghapus SEMUA data (Penghasilan, Pengeluaran, Gaji, dan Roster)?\n\nAksi ini tidak dapat dibatalkan.')) {
    roster = [];
    income = [];
    expense = [];
    salary = [];
    await save('roster', roster);
    await save('income', income);
    await save('expense', expense);
    await save('salary', salary);
    toast('Semua data berhasil direset');
    renderCurrentTab();
  }
});

/* ---------------- INIT ---------------- */
(async function init(){
  await loadAll();
  document.getElementById('loadingScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderCurrentTab();
})();
</script>
