<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Business & Katalog Generator</title>

<script src="https://unpkg.com/html-to-image@1.11.11/dist/html-to-image.js"></script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; }

    body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #f6f8fd 0%, #f1f5f9 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px 15px;
        margin: 0;
        color: #333;
    }

    /* ================= TAB NAVIGATION ================= */
    .tab-nav-wrapper {
        width: 100%;
        max-width: 900px;
        display: flex;
        justify-content: center;
        margin-bottom: 35px;
    }

    .tab-nav {
        display: flex;
        background: #e2e8f0;
        padding: 6px;
        border-radius: 14px;
        width: 100%;
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
    }

    .tab-btn {
        flex: 1;
        background: transparent;
        border: none;
        padding: 12px 10px;
        font-size: 14px;
        font-weight: 600;
        color: #64748b;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.25s ease-in-out;
        font-family: 'Inter', sans-serif;
        text-align: center;
    }

    .tab-btn.active {
        background: #3b82f6;
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(59,130,246,0.25);
    }

    .tab-content {
        display: none;
        width: 100%;
        justify-content: center;
    }

    .tab-content.active {
        display: flex;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ================= SHARED LAYOUT ================= */
    .container {
        display: flex;
        flex-direction: row;
        gap: 30px;
        max-width: 900px;
        width: 100%;
        justify-content: center;
        align-items: flex-start;
    }

    .card {
        --card-bg: #ffffff;
        --card-text: #111111;
        --card-muted: #667781;
        --card-divider: #f0f2f5;
        --thumb-empty-bg: #ffffff;
        --thumb-border: #e2e5e8;
        --btn-bg: #f0f0f0;
        --btn-border: #e0e0e0;
        --btn-text: #111111;
        --btn-stroke: black;
        --btn-icon: #111111;
        --header-icon: #111111;
        --icon-stroke: #555555;
        --icon-filter: none;
        --code-bg: #f4f4f4;
        --code-color: #d63384;
        --font-adjust: 0px;

        background-color: var(--card-bg);
        width: 100%;
        max-width: 400px;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.05);
        overflow: hidden;
        position: relative;
        transition: background-color 0.2s, color 0.2s;
    }

    .card.katalog-card { max-width: 360px; }

    .card.dark {
        --card-bg: #0b1014;
        --card-text: #e9edef;
        --card-muted: #8696a0;
        --card-divider: #070a0d;
        --thumb-empty-bg: #ffffff;
        --thumb-border: #0b1014;
        --btn-bg: #232e35;
        --btn-border: #202c33;
        --btn-text: #e9edef;
        --btn-stroke: #e9edef;
        --btn-icon: #e9edef;
        --header-icon: #e9edef;
        --icon-stroke: #8696a0;
        --icon-filter: invert(1);
        --code-bg: #202c33;
        --code-color: #ff8fab;
    }

    .editor-panel {
        background-color: #ffffff;
        width: 100%;
        max-width: 440px;
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.04);
        border: 1px solid #e2e8f0;
        max-height: 90vh;
        overflow-y: auto;
    }

    .editor-panel h4 {
        margin: 0 0 16px 0;
        color: #0f172a;
        font-size: 15px;
        font-weight: 700;
        border-bottom: 2px solid #f1f5f9;
        padding-bottom: 8px;
    }

    .editor-section { margin-bottom: 24px; }
    .form-group { margin-bottom: 12px; }

    .form-group label {
        display: block;
        font-size: 11.5px;
        font-weight: 600;
        color: #475569;
        margin-bottom: 6px;
    }

    .form-group input[type="text"], 
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-family: inherit;
        font-size: 11.5px;
        color: #334155;
        background-color: #f8fafc;
        transition: all 0.2s ease;
    }

    .form-group input:focus, 
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #3b82f6;
        background-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }

    .file-input {
        width: 100%;
        font-size: 10.5px;
        color: #64748b;
        border: 1.5px dashed #cbd5e1;
        border-radius: 6px;
        padding: 5px;
        background-color: #f8fafc;
        margin-bottom: 8px;
    }

    .file-input::file-selector-button {
        padding: 5px 8px;
        border-radius: 5px;
        border: none;
        background-color: #3b82f6;
        color: white;
        font-weight: 600;
        font-size: 10.5px;
        cursor: pointer;
        margin-right: 6px;
    }

    .btn-download {
        width: 100%;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
        margin-top: 10px;
        transition: all 0.3s ease;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: white;
        box-shadow: 0 4px 10px rgba(59,130,246,0.2);
    }

    .btn-download:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(59,130,246,0.35); }

    /* ================= KATALOG GENERATOR ================= */
    .list-header { display: flex; align-items: center; gap: 14px; padding: 14px 16px; color: var(--card-text); }
    .list-header svg { stroke: var(--header-icon); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; width: 18px; height: 18px; flex-shrink: 0; }
    .list-header .title { font-size: 14.5px; font-weight: 600; flex: 1; }
    .list-header .header-icons { display: flex; gap: 16px; align-items: center; }
    .catalog-list { display: flex; flex-direction: column; padding-bottom: 6px; }
    .empty-state { padding: 30px 20px; text-align: center; color: var(--card-muted); font-size: 11.5px; line-height: 1.5; }
    .catalog-item { display: flex; align-items: center; gap: 14px; padding: 10px 16px; }
    .item-thumb { width: 64px; height: 64px; border-radius: 10px; background-color: var(--thumb-empty-bg); border: 1px solid var(--thumb-border); object-fit: cover; flex-shrink: 0; display: block; }
    .item-text { flex: 1; font-size: 12px; color: var(--card-text); line-height: 1.35; word-break: break-word; white-space: pre-wrap; }
    .item-text:empty::before { content: ''; }
    .item-add { flex-shrink: 0; width: 36px; height: 36px; border-radius: 10px; background-color: var(--btn-bg); display: flex; align-items: center; justify-content: center; }
    .item-add svg { width: 15px; height: 15px; stroke: var(--btn-icon); stroke-width: 2.2; stroke-linecap: round; fill: none; }
    .item-block { border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 12px; background: #fbfcfe; }
    .item-block-title { font-size: 11.5px; font-weight: 700; color: #1e293b; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .item-block-title .badge { background: #3b82f6; color: #fff; width: 16px; height: 16px; border-radius: 50%; font-size: 9.5px; display: flex; align-items: center; justify-content: center; }
    .item-textarea { resize: vertical; min-height: 60px; line-height: 1.5; }

    /* ================= PROFIL BISNIS GENERATOR ================= */
    .cover-img { width: 100%; height: 180px; object-fit: cover; display: none; }
    .profile-pic-container { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; }
    .profile-pic { width: 112px; height: 112px; border-radius: 50%; border: 4px solid var(--card-bg); object-fit: cover; background-color: #eee; display: none; }
    .profile-name { margin: 10px 0 20px 0; font-size: calc(14px + var(--font-adjust)); font-weight: 700; text-align: center; color: var(--card-text); display: none; width: 100%; padding: 0 20px; white-space: pre-wrap; }
    .action-buttons { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 24px; padding: 0 24px; }
    .action-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 25px; border: 1px solid var(--btn-border); border-radius: 12px; background: var(--btn-bg); gap: 8px; }
    .action-btn svg { width: 16px; height: 16px; stroke: var(--btn-stroke); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .action-btn span { font-size: calc(12px + var(--font-adjust)); color: var(--btn-text); font-weight: 500; }
    .action-icon { width: 17px; height: 17px; object-fit: contain; display: block; filter: var(--icon-filter); }
    .thick-divider { border: none; height: 8px; background-color: var(--card-divider); margin: 0; }
    .card-body { padding: 24px 24px 16px 24px; display: flex; flex-direction: column; gap: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header h3 { margin: 0; font-size: calc(12px + var(--font-adjust)); color: var(--card-muted); font-weight: 600; }
    .header a { text-decoration: none; color: #888; font-size: calc(11.5px + var(--font-adjust)); font-weight: 500; }
    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .gallery img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 12px; background-color: #eee; }
    .divider { border: none; height: 4px; background-color: var(--card-divider); margin: 0 -24px 0 -24px; }
    .info-row { display: flex; align-items: flex-start; gap: 16px; }
    .info-row.align-center { align-items: center; }
    .info-icon { width: 15px; height: 15px; fill: none; stroke: var(--icon-stroke); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; margin-top: 2px; }
    .info-row.align-center .info-icon { margin-top: 0; }
    .info-content { flex: 1; font-size: calc(11.6px + var(--font-adjust)); color: var(--card-text); line-height: 1.5; white-space: pre-wrap; }
    .info-row.align-center .info-content { line-height: 1; display: flex; align-items: center; }
    .info-content code { background-color: var(--code-bg); color: var(--code-color); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: calc(11px + var(--font-adjust)); }
    .split-content { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .link-style { text-decoration: none; font-weight: 500; color: #00a884; }
    .ig-link { text-decoration: none; color: var(--card-muted); }

    .file-inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .file-inputs.single { grid-template-columns: 1fr; }

    /* ================= RESPONSIVE FIX UNTUK MOBILE ================= */
    @media (max-width: 768px) {
        .container { 
            flex-direction: column; 
            align-items: center; 
        }
        .card, 
        .card.katalog-card, 
        .editor-panel { 
            max-width: 100%; 
            width: 100%; 
        }
    }
</style>
</head>
<body>

<!-- Tab Navigasi Presisi -->
<div class="tab-nav-wrapper">
    <div class="tab-nav">
        <button class="tab-btn active" onclick="openTab('tab-katalog', this)">Katalog Only</button>
        <button class="tab-btn" onclick="openTab('tab-profile', this)">Setup</button>
    </div>
</div>

<!-- ================= TAB 1: KATALOG ================= -->
<div id="tab-katalog" class="tab-content active">
    <div class="container">
        <div class="card katalog-card" id="katalog-card">
            <div class="list-header">
                <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                <div class="title">Katalog</div>
                <div class="header-icons">
                    <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                </div>
            </div>
            <div class="catalog-list" id="catalog-list">
                <div class="empty-state" id="empty-state">Isi foto atau teks di panel sebelah kanan untuk mulai menampilkan item katalog.</div>
                
                <div class="catalog-item" id="item-1" style="display:none">
                    <img class="item-thumb" id="thumb-1" data-uploaded="false" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
                    <div class="item-text" id="text-1"></div>
                    <div class="item-add"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>
                </div>
                <div class="catalog-item" id="item-2" style="display:none">
                    <img class="item-thumb" id="thumb-2" data-uploaded="false" src="">
                    <div class="item-text" id="text-2"></div>
                    <div class="item-add"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>
                </div>
                <div class="catalog-item" id="item-3" style="display:none">
                    <img class="item-thumb" id="thumb-3" data-uploaded="false" src="">
                    <div class="item-text" id="text-3"></div>
                    <div class="item-add"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>
                </div>
                <div class="catalog-item" id="item-4" style="display:none">
                    <img class="item-thumb" id="thumb-4" data-uploaded="false" src="">
                    <div class="item-text" id="text-4"></div>
                    <div class="item-add"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>
                </div>
                <div class="catalog-item" id="item-5" style="display:none">
                    <img class="item-thumb" id="thumb-5" data-uploaded="false" src="">
                    <div class="item-text" id="text-5"></div>
                    <div class="item-add"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>
                </div>
                <div class="catalog-item" id="item-6" style="display:none">
                    <img class="item-thumb" id="thumb-6" data-uploaded="false" src="">
                    <div class="item-text" id="text-6"></div>
                    <div class="item-add"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>
                </div>
            </div>
        </div>

        <div class="editor-panel">
            <h4>Katalog</h4>
            <div class="form-group">
                <label for="katalog-theme">Theme:</label>
                <select id="katalog-theme">
                    <option value="light">Terang</option>
                    <option value="dark">Gelap</option>
                </select>
            </div>
            <div id="items-wrapper"></div>
            <button class="btn-download" id="btn-save-katalog">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Download PNG
            </button>
        </div>
    </div>
</div>

<!-- ================= TAB 2: PROFIL BISNIS ================= -->
<div id="tab-profile" class="tab-content">
    <div class="container">
        <div class="card" id="profile-card">
            <img id="preview-cover" class="cover-img" alt="Cover" data-uploaded="false" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
            
            <div class="profile-pic-container">
                <img id="preview-pp" class="profile-pic" alt="Profile Picture" data-uploaded="false" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
                <div id="preview-dn" class="profile-name"></div>
            </div>

            <div class="action-buttons" id="action-buttons" style="display: none;">
                <div class="action-btn">
                    <svg class="action-icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    <span>Message</span>
                </div>
                <div class="action-btn">
                    <svg class="action-icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                    <span>Call</span>
                </div>
                <div class="action-btn">
                    <svg class="action-icon" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                    <span>Catalog</span>
                </div>
            </div>

            <hr class="thick-divider" id="divider-1" style="display: none;">

            <div class="card-body">
                <div id="section-katalog" style="display: none;">
                    <div class="header">
                        <h3>Products</h3>
                        <a href="#">SEE ALL &gt;</a>
                    </div>
                    <div class="gallery">
                        <img id="preview-img-1" style="display: none;" alt="Katalog 1" data-uploaded="false" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
                        <img id="preview-img-2" style="display: none;" alt="Katalog 2" data-uploaded="false" src="">
                        <img id="preview-img-3" style="display: none;" alt="Katalog 3" data-uploaded="false" src="">
                        <img id="preview-img-4" style="display: none;" alt="Katalog 4" data-uploaded="false" src="">
                        <img id="preview-img-5" style="display: none;" alt="Katalog 5" data-uploaded="false" src="">
                        <img id="preview-img-6" style="display: none;" alt="Katalog 6" data-uploaded="false" src="">
                    </div>
                    <hr class="divider">
                </div>

                <div class="info-row" id="row-desc" style="display: none;">
                    <svg class="info-icon" style="filter: var(--icon-filter);" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    <div class="info-content" id="preview-desc"></div>
                </div>

                <div class="info-row align-center">
                    <svg class="info-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <div class="info-content split-content"><span>Created</span><span>DiptArm</span></div>
                </div>
                
                <div class="info-row" id="row-loc" style="display: none;">
                    <svg class="info-icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    <div class="info-content"><a href="#" class="link-style" id="preview-loc"></a></div>
                </div>

                <div class="info-row align-center" id="row-email" style="display: none;">
                    <svg class="info-icon" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    <div class="info-content"><a href="" class="link-style" id="preview-email"></a></div>
                </div>

                <div class="info-row align-center" id="row-ig" style="display: none;">
                    <svg class="info-icon" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                    <div class="info-content split-content"><span>Instagram</span><a href="" target="_blank" class="ig-link" id="preview-ig"></a></div>
                </div>
            </div>
        </div>

        <div class="editor-panel">
            <div class="editor-section">
                <h4>Setup Acc</h4>
                <div class="form-group">
                    <label for="profile-theme">Theme:</label>
                    <select id="profile-theme">
                        <option value="light">Terang</option>
                        <option value="dark">Gelap</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Header / Cover:</label>
                    <div class="file-inputs single"><input type="file" class="file-input" id="input-cover" accept="image/*"></div>
                </div>
                <div class="form-group">
                    <label>Profile Picture:</label>
                    <div class="file-inputs single"><input type="file" class="file-input" id="input-pp" accept="image/*"></div>
                </div>
            </div>

            <div class="editor-section">
                <h4>Moodboard</h4>
                <div class="form-group">
                    <div class="file-inputs">
                        <input type="file" class="file-input" id="p-img-1" accept="image/*" title="Slide 1">
                        <input type="file" class="file-input" id="p-img-2" accept="image/*" title="Slide 2">
                        <input type="file" class="file-input" id="p-img-3" accept="image/*" title="Slide 3">
                        <input type="file" class="file-input" id="p-img-4" accept="image/*" title="Slide 4">
                        <input type="file" class="file-input" id="p-img-5" accept="image/*" title="Slide 5">
                        <input type="file" class="file-input" id="p-img-6" accept="image/*" title="Slide 6">
                    </div>
                </div>
            </div>

            <div class="editor-section">
                <h4>Wording</h4>
                <div class="form-group">
                    <label for="input-font-size">Ukuran Font:</label>
                    <select id="input-font-size">
                        <option value="-2">-2px</option>
                        <option value="-1">-1px</option>
                        <option value="-0.5">-0.5px</option>
                        <option value="0" selected>Normal</option>
                        <option value="0.5">+0.5px</option>
                        <option value="1">+1px</option>
                        <option value="2">+2px</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="input-dn">Display Name:</label>
                    <input type="text" id="input-dn" placeholder="Contoh: abc" maxlength="100">
                </div>
                <div class="form-group">
                    <label for="input-desc">Desc:</label>
                    <textarea id="input-desc" maxlength="650"></textarea>
                </div>
                <div class="form-group">
                    <label for="input-loc">Loc:</label>
                    <textarea id="input-loc" placeholder="Contoh: chat if you have any problem..." maxlength="256"></textarea>
                </div>
                <div class="form-group">
                    <label for="input-email">Email:</label>
                    <input type="text" id="input-email" maxlength="40">
                </div>
                <div class="form-group">
                    <label for="input-ig">IG:</label>
                    <input type="text" id="input-ig" maxlength="30">
                </div>
            </div>

            <button class="btn-download" id="btn-save-profile">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Download PNG
            </button>
        </div>
    </div>
</div>

<script>
    // ================= TAB NAVIGATION =================
    function openTab(tabId, btnElement) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btnElement.classList.add('active');
    }

    // ================= SCRIPT KATALOG =================
    const katalogCard = document.getElementById('katalog-card');
    const katalogTheme = document.getElementById('katalog-theme');
    const itemsWrapper = document.getElementById('items-wrapper');
    const emptyState = document.getElementById('empty-state');

    katalogTheme.addEventListener('change', function() {
        if (this.value === 'dark') katalogCard.classList.add('dark');
        else katalogCard.classList.remove('dark');
    });

    for (let i = 1; i <= 6; i++) {
        const block = document.createElement('div');
        block.className = 'item-block';
        block.innerHTML = `
            <div class="item-block-title"><span class="badge">${i}</span> Item ${i}</div>
            <input type="file" class="file-input" id="k-img-${i}" accept="image/*">
            <textarea class="item-textarea form-group" style="width:100%; padding:10px; border-radius:8px; border:1px solid #cbd5e1; background:#f8fafc;" id="k-text-${i}" rows="2" placeholder="Contoh: ㅤ❏.ㅤ'Pure &. Lovelyㅤ**ㅤSweetheart."></textarea>
        `;
        itemsWrapper.appendChild(block);
    }

    function checkEmptyState() {
        let anyVisible = false;
        for (let i = 1; i <= 6; i++) {
            if (document.getElementById('item-' + i).style.display !== 'none') anyVisible = true;
        }
        emptyState.style.display = anyVisible ? 'none' : 'block';
    }

    function updateKatalogItem(i) {
        const row = document.getElementById('item-' + i);
        const thumb = document.getElementById('thumb-' + i);
        const textEl = document.getElementById('text-' + i);
        const textVal = document.getElementById('k-text-' + i).value;
        const hasImg = thumb.getAttribute('data-uploaded') === 'true';
        const hasText = textVal.trim() !== '';

        if (hasText) textEl.textContent = textVal;
        else if (hasImg) textEl.textContent = '...';
        else textEl.textContent = '';
        
        thumb.style.display = 'block';

        if (hasImg || hasText) row.style.display = 'flex';
        else row.style.display = 'none';
        
        checkEmptyState();
    }

    for (let i = 1; i <= 6; i++) {
        document.getElementById('k-img-' + i).addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.addEventListener('load', function() {
                const thumb = document.getElementById('thumb-' + i);
                thumb.setAttribute('src', this.result);
                thumb.setAttribute('data-uploaded', 'true');
                updateKatalogItem(i);
            });
            reader.readAsDataURL(file);
        });
        document.getElementById('k-text-' + i).addEventListener('input', () => updateKatalogItem(i));
    }
    checkEmptyState();

    // ================= SCRIPT PROFIL =================
    function parseFormatting(text) {
        let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        html = html.replace(/\*(.*?)\*/g, '<b>$1</b>');
        html = html.replace(/_(.*?)_/g, '<i>$1</i>');
        html = html.replace(/~(.*?)~/g, '<s>$1</s>');
        html = html.replace(/`(.*?)`/g, '<code>$1</code>');
        return html;
    }

    function setupImageUpload(inputEl, imgPreviewEl, callback) {
        inputEl.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.addEventListener('load', function() {
                    imgPreviewEl.setAttribute('src', this.result);
                    imgPreviewEl.setAttribute('data-uploaded', 'true');
                    if (callback) callback(); 
                });
                reader.readAsDataURL(file);
            }
        });
    }

    const profileCard = document.getElementById('profile-card');
    document.getElementById('profile-theme').addEventListener('change', function() {
        if (this.value === 'dark') profileCard.classList.add('dark');
        else profileCard.classList.remove('dark');
    });

    document.getElementById('input-font-size').addEventListener('change', function() {
        profileCard.style.setProperty('--font-adjust', this.value + 'px');
    });

    const imgCover = document.getElementById('preview-cover');
    const imgPP = document.getElementById('preview-pp');
    const inputDN = document.getElementById('input-dn');
    const previewDN = document.getElementById('preview-dn');
    const actionBtns = document.getElementById('action-buttons');
    const divider1 = document.getElementById('divider-1');

    function updateProfileHeader() {
        const hasCover = imgCover.getAttribute('data-uploaded') === 'true';
        const hasPP = imgPP.getAttribute('data-uploaded') === 'true';
        const dnVal = inputDN.value;

        imgCover.style.display = hasCover ? 'block' : 'none';
        imgPP.style.display = hasPP ? 'block' : 'none';
        imgPP.style.marginTop = hasCover ? '-80px' : '24px';

        if (dnVal.trim() === "") {
            previewDN.style.display = 'none';
            actionBtns.style.display = 'none';
            divider1.style.display = 'none';
        } else {
            previewDN.style.display = 'block';
            previewDN.textContent = dnVal;
            actionBtns.style.display = 'flex';
            divider1.style.display = 'block';
        }
    }
    setupImageUpload(document.getElementById('input-cover'), imgCover, updateProfileHeader);
    setupImageUpload(document.getElementById('input-pp'), imgPP, updateProfileHeader);
    inputDN.addEventListener('input', updateProfileHeader);

    const sectionKatalog = document.getElementById('section-katalog');
    const pImgs = [1,2,3,4,5,6].map(i => document.getElementById('preview-img-' + i));

    function updateMoodboardRow() {
        let hasAnyImage = false;
        pImgs.forEach(img => {
            const hasImg = img.getAttribute('data-uploaded') === 'true';
            img.style.display = hasImg ? 'block' : 'none';
            if (hasImg) hasAnyImage = true;
        });
        sectionKatalog.style.display = hasAnyImage ? 'block' : 'none';
    }
    
    for(let i=1; i<=6; i++) {
        setupImageUpload(document.getElementById('p-img-'+i), pImgs[i-1], updateMoodboardRow);
    }

    function setupRowUpdate(inputId, rowId, previewId, isLink = false, isEmail = false) {
        document.getElementById(inputId).addEventListener('input', function() {
            const val = this.value.trim();
            const row = document.getElementById(rowId);
            const preview = document.getElementById(previewId);
            if (val === "") {
                row.style.display = "none";
            } else {
                row.style.display = "flex";
                if (isLink) {
                    preview.innerHTML = parseFormatting(val);
                } else if (isEmail) {
                    preview.textContent = val;
                    preview.setAttribute('href', 'mailto:' + val);
                } else {
                    preview.textContent = val;
                }
            }
        });
    }

    setupRowUpdate('input-desc', 'row-desc', 'preview-desc', true);
    setupRowUpdate('input-loc', 'row-loc', 'preview-loc', true);
    setupRowUpdate('input-email', 'row-email', 'preview-email', false, true);
    setupRowUpdate('input-ig', 'row-ig', 'preview-ig');

    updateProfileHeader();
    updateMoodboardRow();

    // ================= DOWNLOAD HANDLERS =================
    function downloadHD(nodeId, themeInputId, btnElement, filename) {
        const node = document.getElementById(nodeId);
        const scale = 4; 
        const originalText = btnElement.innerHTML;
        const activeTheme = document.getElementById(themeInputId).value;
        const captureBgColor = activeTheme === 'dark' ? '#0b1014' : '#ffffff';

        btnElement.innerHTML = 'Sedang memproses...';
        btnElement.style.opacity = '0.7';
        btnElement.style.pointerEvents = 'none';

        htmlToImage.toPng(node, {
            pixelRatio: scale,
            bgcolor: captureBgColor,
            cacheBust: true,
            filter: function (n) { return !(n.style && n.style.display === 'none'); },
            style: { transform: 'none', transformOrigin: 'top left', width: node.offsetWidth + 'px', height: node.offsetHeight + 'px' }
        })
        .then(function (dataUrl) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = dataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        })
        .catch(function (error) {
            console.error('Gagal membuat gambar:', error);
            alert('Gagal mengunduh gambar.');
        })
        .finally(function () {
            btnElement.innerHTML = originalText;
            btnElement.style.opacity = '1';
            btnElement.style.pointerEvents = 'auto';
        });
    }

    document.getElementById('btn-save-katalog').addEventListener('click', function() {
        downloadHD('katalog-card', 'katalog-theme', this, 'katalog-wa.png');
    });

    document.getElementById('btn-save-profile').addEventListener('click', function() {
        downloadHD('profile-card', 'profile-theme', this, 'profile-wa.png');
    });

</script>

</body>
</html>
